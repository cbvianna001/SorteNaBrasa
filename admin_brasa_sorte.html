<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Admin - Sorte na Brasa</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background: #f4f4f4; max-width: 800px; margin: 0 auto; }
        .card { background: white; padding: 15px; margin-bottom: 12px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .card.pago { border-left: 6px solid #27ae60; }
        .card.reservado { border-left: 6px solid #f39c12; }
        button { padding: 8px 12px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; margin-top: 5px; }
        .btn-pago { background: #27ae60; color: white; }
        .btn-limpar { background: #c0392b; color: white; }
        .btn-config { background: #2980b9; color: white; }
        .btn-zerar { background: #c0392b; color: white; padding: 12px; width: 100%; font-size: 15px; margin-top: 10px; }
        .btn-sorteador { background: #8e44ad; color: white; padding: 12px; width: 100%; font-size: 16px; font-weight: bold; margin-bottom: 15px; border-radius: 6px; }
        h1 { color: #d35400; text-align: center; }
        .config-box { background: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: center; }
        .historico-box { background: #fff; padding: 15px; border-radius: 8px; margin-top: 30px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        input[type="number"], input[type="text"] { padding: 8px; border-radius: 4px; border: 1px solid #ccc; font-weight: bold; }
        .resultado-sorteio { background: #f39c12; color: white; padding: 15px; border-radius: 8px; text-align: center; font-size: 18px; font-weight: bold; margin-bottom: 20px; display: none; }
    </style>
</head>
<body>
    <h1>Painel de Controle - Sorte na Brasa</h1>
    
    <div style="text-align: center;">
        <button class="btn-sorteador" onclick="realizarSorteio()">🎲 Sortear Número Premiado Agora!</button>
    </div>
    <div id="resultado-sorteio" class="resultado-sorteio"></div>

    <div class="config-box">
        <h3>Configurações da Rifa</h3>
        
        <div style="margin-bottom: 15px;">
            <p style="font-size: 13px; color: #666;">Texto de Valores exibido no topo do site:</p>
            <input type="text" id="input-texto-preco" style="width: 80%; margin-bottom: 5px;">
            <br>
            <button class="btn-config" onclick="atualizarTextoPreco()">Salvar Texto de Preços</button>
        </div>

        <hr style="margin: 15px 0; border: 0; border-top: 1px solid #eee;">

        <div style="margin-bottom: 15px;">
            <p style="font-size: 13px; color: #666;">Valor base de cada número (R$ para cálculo):</p>
            <input type="number" id="input-valor-numero" step="0.50" min="1.00" style="width: 100px; text-align: center;">
            <button class="btn-config" onclick="atualizarValorPreco()">Salvar Valor Base</button>
        </div>

        <hr style="margin: 15px 0; border: 0; border-top: 1px solid #eee;">

        <div>
            <p style="font-size: 13px; color: #666;">Quantidade total de números:</p>
            <input type="number" id="input-qtd-total" value="100" min="10" max="1000" style="width: 100px; text-align: center;">
            <button class="btn-config" onclick="atualizarTotalNumeros()">Salvar Quantidade</button>
        </div>
        
        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
        
        <h3 style="color: #c0392b;">Área de Sorteio / Reiniciar</h3>
        <button class="btn-zerar" onclick="zerarEArquivarRifa()">🔄 Salvar Histórico e Zerar Rifa</button>
    </div>

    <div id="lista-admin">Carregando dados...</div>

    <div class="historico-box">
        <h3 style="color: #2c3e50; border-bottom: 2px solid #eee; padding-bottom: 8px;">📂 Histórico de Vendas Anteriores</h3>
        <div id="lista-historico">Carregando histórico...</div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ietzotyphojdfgtbsbmo.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlldHpvdHlwaG9qZGZndGJzYm1vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5ODcxNDAsImV4cCI6MjEwMjU2MzE0MH0.ajlerHMhUcsnD6Awt4FA7DTHRe4ux5XtbhoKoYP-xQw'; // <--- Mesma chave pública
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let valorUnitario = 5.00;

        async function carregarConfiguracoes() {
            const { data: dVal } = await _supabase.from('configuracoes').select('*').eq('chave', 'valor_numero').single();
            if (dVal) {
                valorUnitario = parseFloat(dVal.valor);
                document.getElementById('input-valor-numero').value = valorUnitario.toFixed(2);
            }

            const { data: dTxt } = await _supabase.from('configuracoes').select('*').eq('chave', 'texto_preco').single();
            if (dTxt) {
                document.getElementById('input-texto-preco').value = dTxt.valor;
            }
        }

        function calcularValorTotal(qtd) {
            let blocos = Math.floor(qtd / 5);
            let resto = qtd % 5;
            let precoCinco = (valorUnitario * 5) * 0.8; // Mantém a proporção de desconto se houver
            return (blocos * (valorUnitario >= 5 ? 20 : precoCinco)) + (resto * valorUnitario);
        }

        async function atualizarValorPreco() {
            const novoValor = parseFloat(document.getElementById('input-valor-numero').value);
            if (!novoValor || novoValor <= 0) { alert('Digite um valor válido!'); return; }

            const { error } = await _supabase.from('configuracoes').update({ valor: novoValor.toString() }).eq('chave', 'valor_numero');
            if (error) alert('Erro: ' + error.message);
            else { valorUnitario = novoValor; alert('Valor base atualizado com sucesso!'); carregarAdmin(); }
        }

        async function atualizarTextoPreco() {
            const novoTexto = document.getElementById('input-texto-preco').value;
            const { error } = await _supabase.from('configuracoes').update({ valor: novoTexto }).eq('chave', 'texto_preco');
            if (error) alert('Erro: ' + error.message);
            else alert('Texto de preços atualizado com sucesso!');
        }

        async function carregarAdmin() {
            await carregarConfiguracoes();
            const container = document.getElementById('lista-admin');
            const { data: rifas } = await _supabase.from('rifa_numeros').select('*').order('numero', { ascending: true });
            
            if (rifas && rifas.length > 0) {
                document.getElementById('input-qtd-total').value = rifas.length;
            }

            let gruposMap = {};
            rifas.forEach(item => {
                if (item.status === 'disponivel') return;
                let chave = item.status + '-' + (item.cpf || 'sem-cpf') + '-' + (item.nome_comprador || 'desconhecido');
                if (!gruposMap[chave]) {
                    gruposMap[chave] = { nome: item.nome_comprador, cpf: item.cpf, whatsapp: item.whatsapp, statusGeral: item.status, numeros: [] };
                }
                gruposMap[chave].numeros.push(item.numero);
            });

            container.innerHTML = '';
            const chaves = Object.keys(gruposMap);

            if (chaves.length === 0) {
                container.innerHTML = '<p style="text-align:center; background:white; padding:20px; border-radius:8px;">Nenhum número reservado ou vendido no momento.</p>';
            } else {
                chaves.forEach(chave => {
                    let grupo = gruposMap[chave];
                    let totalNumeros = grupo.numeros.length;
                    let valorTotal = calcularValorTotal(totalNumeros);

                    const div = document.createElement('div');
                    div.className = 'card ' + grupo.statusGeral;
                    div.innerHTML = `
                        <div>
                            <strong>Nome:</strong> ${grupo.nome}<br>
                            <strong>CPF:</strong> ${grupo.cpf || 'Não informado'}<br>
                            <strong>WhatsApp:</strong> ${grupo.whatsapp || 'Não informado'}<br>
                            <strong>Status do Lote:</strong> <span style="text-transform: uppercase; font-weight: bold; color: ${grupo.statusGeral === 'pago' ? '#27ae60' : '#f39c12'}">${grupo.statusGeral}</span><br>
                            <strong>Números (${totalNumeros}):</strong> ${grupo.numeros.join(', ')}<br>
                            <strong>Valor Total:</strong> R$ ${valorTotal.toFixed(2).replace('.', ',')}
                        </div>
                        <div style="margin-top: 10px;">
                            ${grupo.statusGeral === 'reservado' ? `<button class="btn-pago" onclick='atualizarLote(${JSON.stringify(grupo.numeros)}, "pago")'>Confirmar Pagamento</button>` : ''}
                            <button class="btn-limpar" onclick='atualizarLote(${JSON.stringify(grupo.numeros)}, "disponivel")'>Liberar Números</button>
                        </div>
                    `;
                    container.appendChild(div);
                });
            }
            carregarHistorico();
        }

        async function atualizarLote(numerosArray, novoStatus) {
            const updateData = novoStatus === 'disponivel' 
                ? { status: 'disponivel', nome_comprador: null, cpf: null, whatsapp: null }
                : { status: novoStatus };
            for (let num of numerosArray) {
                await _supabase.from('rifa_numeros').update(updateData).eq('numero', num);
            }
            carregarAdmin();
        }

        async function atualizarTotalNumeros() {
            const novaQtd = parseInt(document.getElementById('input-qtd-total').value);
            if (!novaQtd || novaQtd <= 0) return;
            if (!confirm(`Deseja alterar a quantidade total para ${novaQtd} números?`)) return;

            const { data: rifasAtuais } = await _supabase.from('rifa_numeros').select('*');
            const totalAtual = rifasAtuais.length;

            if (novaQtd > totalAtual) {
                let novosRegistros = [];
                for (let i = totalAtual + 1; i <= novaQtd; i++) novosRegistros.push({ numero: i, status: 'disponivel' });
                await _supabase.from('rifa_numeros').insert(novosRegistros);
            } else if (novaQtd < totalAtual) {
                for (let i = totalAtual; i > novaQtd; i--) await _supabase.from('rifa_numeros').delete().eq('numero', i);
            }
            alert('Quantidade atualizada!');
            carregarAdmin();
        }

        async function realizarSorteio() {
            const { data: rifas } = await _supabase.from('rifa_numeros').select('*');
            const pagos = rifas.filter(item => item.status === 'pago');
            if (pagos.length === 0) { alert('Nenhum número pago para sortear!'); return; }
            const sorteado = pagos[Math.floor(Math.random() * pagos.length)];
            const divResultado = document.getElementById('resultado-sorteio');
            divResultado.style.display = 'block';
            divResultado.innerHTML = `🎉 NÚMERO SORTEADO: <strong>${sorteado.numero}</strong><br>Ganhador: <strong>${sorteado.nome_comprador}</strong>`;
        }

        async function zerarEArquivarRifa() {
            if (!confirm('Deseja salvar o histórico e zerar a rifa?')) return;
            const { data: rifas } = await _supabase.from('rifa_numeros').select('*');
            let clientesMap = {};
            rifas.forEach(item => {
                if (item.status === 'disponivel') return;
                let chave = (item.cpf || 'sem-cpf') + '-' + (item.nome_comprador || 'desconhecido');
                if (!clientesMap[chave]) clientesMap[chave] = { nome: item.nome_comprador, cpf: item.cpf, whatsapp: item.whatsapp, numeros: [] };
                clientesMap[chave].numeros.push(item.numero);
            });

            let historicoParaInserir = [];
            for (let chave in clientesMap) {
                let c = clientesMap[chave];
                historicoParaInserir.push({ nome: c.nome, cpf: c.cpf, whatsapp: c.whatsapp, numeros: c.numeros.join(', '), total_pago: calcularValorTotal(c.numeros.length) });
            }
            if (historicoParaInserir.length > 0) await _supabase.from('historico_vendas').insert(historicoParaInserir);

            await _supabase.from('rifa_numeros').update({ status: 'disponivel', nome_comprador: null, cpf: null, whatsapp: null }).gte('numero', 1);
            alert('Rifa zerada com sucesso!');
            document.getElementById('resultado-sorteio').style.display = 'none';
            carregarAdmin();
        }

        async function carregarHistorico() {
            const containerHist = document.getElementById('lista-historico');
            const { data: historico } = await _supabase.from('historico_vendas').select('*').order('data_salvamento', { ascending: false });
            if (!historico || historico.length === 0) { containerHist.innerHTML = '<p style="font-size: 13px; color: #777;">Nenhum histórico anterior.</p>'; return; }
            containerHist.innerHTML = '';
            historico.navigation = historico.forEach(h => {
                const divH = document.createElement('div');
                divH.style.cssText = "background: #f9f9f9; padding: 10px; margin-bottom: 8px; border-radius: 6px; border-left: 4px solid #8e44ad; font-size: 13px;";
                divH.innerHTML = `<strong>Comprador:</strong> ${h.nome} | <strong>Números:</strong> ${h.numeros} | <strong>Total:</strong> R$ ${Number(h.total_pago).toFixed(2)}`;
                containerHist.appendChild(divH);
            });
        }

        carregarAdmin();
    </script>
</body>
</html>
